name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No secrets are set. The signed-in e2e (e2e/account.spec.ts) and the Supabase repository contract skip themselves
    # without them. To turn them on, add the repo secrets NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
    # TEST_USER_EMAIL and TEST_USER_PASSWORD, and pass them in the env below (they run against the real project).
    env:
      # Placeholders (not secrets) so the account pages render their log in and sign up forms for the logged-out
      # e2e checks. Nothing signs in, so nothing calls this address.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      # Firefox can't launch on the author's Mac, so this is the only place it runs.
      - run: npx playwright install --with-deps chromium firefox
      # playwright.config.ts starts `npm run dev` itself; the /demo needs no env vars.
      - run: npx playwright test --project=chromium --project=firefox --reporter=list,html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
